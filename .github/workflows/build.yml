name: Build and Release

on:
  push:
    tags:
      - 'v*' # Nickelony edit here
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (Release)
        run: msbuild "Universal Tomb Launcher.sln" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare Staging and Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging

          Copy-Item -Path "Universal Tomb Launcher\bin\Release\*" -Destination "staging\" -Recurse

          Compress-Archive -Path staging\* -DestinationPath Universal-Tomb-Launcher.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Universal-Tomb-Launcher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
